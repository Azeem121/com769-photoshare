<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoShare — Browse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #F8FAFC; }

    .spinner { display:inline-block;width:22px;height:22px;border:3px solid rgba(37,99,235,.15);border-top-color:#2563EB;border-radius:50%;animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 40; height: 60px;
      background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid #F1F5F9;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      display: flex; align-items: center; padding: 0 24px; gap: 16px;
    }

    /* Search */
    .search-wrap { position:relative; flex:1; max-width:480px; }
    .search-wrap svg { position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9CA3AF;pointer-events:none; }
    .search-input {
      width:100%;padding:9px 14px 9px 38px;background:#F3F4F6;border:1.5px solid transparent;
      border-radius:10px;font-size:13.5px;color:#111827;outline:none;font-family:inherit;transition:all .15s;
    }
    .search-input:focus { background:#fff;border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .search-input::placeholder { color:#9CA3AF; }

    /* Filter bar */
    .filterbar {
      position:sticky;top:60px;z-index:30;background:#fff;
      border-bottom:1px solid #F1F5F9;padding:10px 24px;
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    }
    .filter-sel {
      display:flex;align-items:center;gap:7px;background:#F3F4F6;border-radius:8px;
      padding:7px 12px;border:none;font-size:12.5px;font-weight:600;color:#374151;cursor:pointer;font-family:inherit;
    }
    .filter-sel select { background:none;border:none;outline:none;font-size:12.5px;font-weight:600;color:#374151;cursor:pointer;font-family:inherit; }
    .filter-btn {
      padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:700;
      cursor:pointer;border:none;font-family:inherit;transition:all .15s;
    }
    .filter-btn-blue { background:#EFF6FF;color:#2563EB; }
    .filter-btn-blue:hover { background:#DBEAFE; }
    .filter-btn-gray { background:#F3F4F6;color:#6B7280;display:none; }
    .filter-btn-gray:hover { background:#E5E7EB; }

    /* Photo card */
    .photo-card {
      border-radius:14px;overflow:hidden;cursor:pointer;position:relative;
      box-shadow:0 1px 3px rgba(0,0,0,.06);transition:all .3s ease;
    }
    .photo-card:hover { transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.14); }
    .photo-card img   { transition:transform .4s ease; }
    .photo-card:hover img { transform:scale(1.06); }
    .card-overlay {
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.1) 50%,transparent 100%);
      display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
    }

    /* Modal */
    .modal-bg { position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px; }
    .modal-bg.open { display:flex; }
    .modal-panel {
      background:#fff;border-radius:20px;width:100%;max-width:960px;max-height:90vh;
      display:flex;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.3);
      animation:slideUp .2s ease;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)scale(.97)} to{opacity:1;transform:none} }

    /* Stars */
    .star { font-size:26px;cursor:pointer;transition:transform .1s;line-height:1;color:#E5E7EB; }
    .star:hover { transform:scale(1.3); }

    /* Comment bubble */
    .comment-bubble { display:flex;gap:10px;margin-bottom:10px; }
    .comment-avatar { width:28px;height:28px;border-radius:50%;background:#EFF6FF;color:#2563EB;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .comment-body   { background:#F8FAFC;border-radius:12px;padding:8px 12px;flex:1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:#CBD5E1;border-radius:4px; }
  </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────────── -->
<nav class="navbar">
  <!-- Brand -->
  <a href="#" style="display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0;">
    <div style="width:36px;height:36px;background:#2563EB;border-radius:10px;display:flex;align-items:center;justify-content:center;">
      <svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
        <circle cx="12" cy="13" r="3"/>
      </svg>
    </div>
    <span style="font-weight:900;font-size:17px;color:#111827;letter-spacing:-.3px;">PhotoShare</span>
  </a>

  <!-- Search bar -->
  <div class="search-wrap">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search-input" class="search-input" placeholder="Search photos, places, tags…"
      onkeydown="if(event.key==='Enter')applySearch()" />
  </div>

  <!-- User pill -->
  <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
    <div style="display:flex;align-items:center;gap:8px;background:#F3F4F6;border-radius:50px;padding:6px 12px;">
      <div id="user-avatar" style="width:26px;height:26px;border-radius:50%;background:#2563EB;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;">?</div>
      <span id="nav-username" style="font-size:13px;font-weight:700;color:#374151;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" class="hidden sm:block">…</span>
      <span style="background:#DBEAFE;color:#1D4ED8;font-size:11px;font-weight:800;padding:2px 8px;border-radius:50px;">Consumer</span>
    </div>
    <button onclick="logout()" style="font-size:13px;font-weight:600;color:#9CA3AF;background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit;" onmouseover="this.style.color='#EF4444';this.style.background='#FEF2F2';" onmouseout="this.style.color='#9CA3AF';this.style.background='none';">Sign out</button>
  </div>
</nav>

<!-- ── Filter bar ───────────────────────────────────────────────────────────── -->
<div class="filterbar">
  <div class="filter-sel">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"/></svg>
    <select id="sort-select" onchange="applyFilters()">
      <option value="recent">Most Recent</option>
      <option value="rating">Top Rated</option>
    </select>
  </div>
  <div class="filter-sel">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/></svg>
    <select id="tag-select" onchange="applyFilters()"><option value="">All Tags</option></select>
  </div>
  <button class="filter-btn filter-btn-blue" onclick="applySearch()">Search</button>
  <button id="clear-btn" class="filter-btn filter-btn-gray" onclick="clearSearch()">✕ Clear</button>
  <span id="result-count" style="margin-left:auto;font-size:12px;font-weight:600;color:#94A3B8;"></span>
</div>

<!-- ── Photo Grid ───────────────────────────────────────────────────────────── -->
<main style="max-width:1600px;margin:0 auto;padding:24px;">
  <div id="photos-grid" style="columns:2;column-gap:14px;" class="sm:columns-3 md:columns-4 lg:columns-5 xl:columns-6">
    <div style="column-span:all;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 0;gap:16px;color:#94A3B8;">
      <span class="spinner"></span>
      <p style="margin:0;font-size:14px;font-weight:500;">Loading photos…</p>
    </div>
  </div>
  <div style="text-align:center;margin-top:32px;">
    <button id="load-more-btn" onclick="loadMore()" style="display:none;padding:11px 28px;background:#fff;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13.5px;font-weight:700;color:#374151;cursor:pointer;font-family:inherit;transition:all .15s;"
      onmouseover="this.style.borderColor='#2563EB';this.style.color='#2563EB';" onmouseout="this.style.borderColor='#E5E7EB';this.style.color='#374151';">
      Load more photos
    </button>
  </div>
</main>

<!-- ── Modal ────────────────────────────────────────────────────────────────── -->
<div id="modal-bg" class="modal-bg" onclick="handleOverlayClick(event)">
  <div class="modal-panel">

    <!-- Image side -->
    <div style="background:#0F172A;flex:0 0 52%;display:flex;align-items:center;justify-content:center;position:relative;min-height:300px;">
      <img id="modal-img" src="" alt="" style="width:100%;height:100%;object-fit:contain;max-height:90vh;" />
      <button onclick="closeModal()" class="md:hidden" style="position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Info side -->
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">

      <!-- Header -->
      <div style="padding:20px 22px 16px;border-bottom:1px solid #F1F5F9;flex-shrink:0;display:flex;gap:12px;align-items:flex-start;">
        <div style="flex:1;">
          <h2 id="modal-title" style="margin:0 0 5px;font-size:19px;font-weight:800;color:#111827;letter-spacing:-.3px;">Loading…</h2>
          <p  id="modal-caption" style="margin:0;font-size:13.5px;color:#6B7280;line-height:1.5;"></p>
        </div>
        <button onclick="closeModal()" class="hidden md:flex" style="width:30px;height:30px;border-radius:8px;background:#F3F4F6;border:none;cursor:pointer;color:#6B7280;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Scrollable body -->
      <div style="flex:1;overflow-y:auto;">

        <!-- Meta -->
        <div id="modal-meta" style="padding:12px 22px;border-bottom:1px solid #F1F5F9;display:flex;flex-wrap:wrap;gap:12px 20px;font-size:12.5px;color:#6B7280;"></div>

        <!-- AI Tags -->
        <div id="modal-tags" style="display:none;padding:12px 22px;border-bottom:1px solid #F1F5F9;">
          <p style="margin:0 0 8px;font-size:10.5px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.8px;">AI Tags</p>
          <div id="modal-tags-inner" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
        </div>

        <!-- Rating -->
        <div style="padding:14px 22px;border-bottom:1px solid #F1F5F9;">
          <p style="margin:0 0 10px;font-size:10.5px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.8px;">Your Rating</p>
          <div style="display:flex;align-items:center;gap:10px;">
            <div id="star-input" style="display:flex;gap:3px;">
              <span class="star" data-v="1">★</span>
              <span class="star" data-v="2">★</span>
              <span class="star" data-v="3">★</span>
              <span class="star" data-v="4">★</span>
              <span class="star" data-v="5">★</span>
            </div>
            <span id="rating-summary" style="font-size:12px;font-weight:600;color:#94A3B8;"></span>
          </div>
        </div>

        <!-- Comments -->
        <div style="padding:14px 22px;">
          <p style="margin:0 0 12px;font-size:10.5px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.8px;">Comments</p>
          <div id="comments-list" style="max-height:160px;overflow-y:auto;margin-bottom:14px;"></div>
          <form onsubmit="submitComment(event)" style="display:flex;gap:8px;">
            <input type="text" id="comment-text" maxlength="1000" placeholder="Add a comment…"
              style="flex:1;padding:10px 14px;background:#F8FAFC;border:1.5px solid #E5E7EB;border-radius:10px;font-size:13.5px;color:#111827;outline:none;font-family:inherit;transition:all .15s;"
              onfocus="this.style.borderColor='#2563EB';this.style.background='#fff';"
              onblur="this.style.borderColor='#E5E7EB';this.style.background='#F8FAFC';" />
            <button type="submit" style="padding:10px 18px;background:#2563EB;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;"
              onmouseover="this.style.background='#1D4ED8';" onmouseout="this.style.background='#2563EB';">Post</button>
          </form>
          <p id="comment-error" style="display:none;font-size:12px;font-weight:600;color:#EF4444;margin-top:6px;"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/shared/auth.js"></script>
<script src="/shared/api.js"></script>
<script>
  let currentPage = 1, PAGE_SIZE = 18;
  let activeSearch = "", activeSort = "recent", activeTag = "";
  let openPhotoId = null, knownTags = new Set();

  (async () => {
    const user = requireAuth("consumer");
    if (!user) return;
    setNavUser(user);
    document.getElementById("user-avatar").textContent = (user.username || "?")[0].toUpperCase();
    setupStars();
    await loadPhotos(true);
  })();

  function applySearch() {
    activeSearch = document.getElementById("search-input").value.trim();
    document.getElementById("clear-btn").style.display = activeSearch ? "block" : "none";
    applyFilters();
  }
  function clearSearch() {
    document.getElementById("search-input").value = "";
    activeSearch = "";
    document.getElementById("clear-btn").style.display = "none";
    applyFilters();
  }
  function applyFilters() {
    activeSort = document.getElementById("sort-select").value;
    activeTag  = document.getElementById("tag-select").value;
    loadPhotos(true);
  }

  async function loadPhotos(reset) {
    if (reset) {
      currentPage = 1;
      document.getElementById("photos-grid").innerHTML =
        '<div style="column-span:all;display:flex;flex-direction:column;align-items:center;padding:80px 0;gap:16px;color:#94A3B8;"><span class="spinner"></span><p style="margin:0;font-size:14px;font-weight:500;">Loading…</p></div>';
    }
    try {
      const data = await listPhotos({ search: activeSearch, sort: activeSort, tag: activeTag, page: currentPage, limit: PAGE_SIZE });
      if (!data?.photos) return;
      const grid = document.getElementById("photos-grid");
      if (reset) grid.innerHTML = "";
      if (!data.photos.length && reset) {
        grid.innerHTML = `<div style="column-span:all;display:flex;flex-direction:column;align-items:center;padding:80px 0;gap:12px;color:#CBD5E1;">
          <svg width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
          <p style="margin:0;font-size:15px;font-weight:700;color:#94A3B8;">${activeSearch ? `No results for "${esc(activeSearch)}"` : "No photos yet"}</p>
          <p style="margin:0;font-size:13px;color:#CBD5E1;">Try a different search or check back later</p></div>`;
        document.getElementById("load-more-btn").style.display = "none";
        document.getElementById("result-count").textContent = "";
        return;
      }
      data.photos.forEach(p => { (p.aiTags||[]).forEach(t => knownTags.add(t)); grid.appendChild(makeCard(p)); });
      updateTagFilter();
      document.getElementById("result-count").textContent = data.total ? `${data.total} photo${data.total!==1?"s":""}` : "";
      document.getElementById("load-more-btn").style.display = data.photos.length < PAGE_SIZE ? "none" : "inline-block";
    } catch (err) {
      document.getElementById("photos-grid").innerHTML =
        `<div style="column-span:all;text-align:center;padding:80px 0;color:#EF4444;font-size:14px;">Error: ${esc(err.message)}</div>`;
    }
  }

  function loadMore() { currentPage++; loadPhotos(false); }

  function updateTagFilter() {
    const sel = document.getElementById("tag-select"), cur = sel.value;
    sel.innerHTML = '<option value="">All Tags</option>';
    [...knownTags].sort().forEach(t => {
      const o = document.createElement("option");
      o.value = t; o.textContent = t; if (t===cur) o.selected = true;
      sel.appendChild(o);
    });
  }

  function makeCard(photo) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "break-inside:avoid;margin-bottom:14px;";
    const div = document.createElement("div");
    div.className = "photo-card";
    div.onclick = () => openModal(photo.id);
    const tag   = (photo.aiTags||[])[0];
    const stars  = photo.avgRating ? `★ ${photo.avgRating.toFixed(1)}` : "";
    div.innerHTML = `
      <div style="overflow:hidden;border-radius:14px;background:#E2E8F0;">
        <img src="${photo.imageUrl}" alt="${esc(photo.title)}" loading="lazy"
          style="width:100%;display:block;object-fit:cover;" />
      </div>
      <div class="card-overlay" style="border-radius:14px;">
        <p style="margin:0 0 4px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(photo.title)}</p>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          ${photo.location ? `<span style="color:rgba(255,255,255,.65);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;">📍 ${esc(photo.location)}</span>` : '<span></span>'}
          ${stars ? `<span style="color:rgba(255,255,255,.9);font-size:12px;font-weight:700;">${stars}</span>` : ""}
        </div>
        ${tag ? `<span style="margin-top:5px;display:inline-block;background:rgba(255,255,255,.18);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:50px;">${esc(tag)}</span>` : ""}
      </div>`;
    wrap.appendChild(div);
    return wrap;
  }

  async function openModal(photoId) {
    openPhotoId = photoId;
    document.getElementById("modal-bg").classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("modal-img").src = "";
    document.getElementById("modal-title").textContent = "Loading…";
    document.getElementById("modal-caption").textContent = "";
    document.getElementById("modal-meta").innerHTML = "";
    document.getElementById("modal-tags").style.display = "none";
    document.getElementById("modal-tags-inner").innerHTML = "";
    document.getElementById("comments-list").innerHTML = "<p style='color:#94A3B8;font-size:13px;margin:0;'>Loading…</p>";
    document.getElementById("rating-summary").textContent = "";
    document.getElementById("comment-error").style.display = "none";
    resetStars(null);
    try { renderModal(await getPhoto(photoId)); }
    catch (err) { document.getElementById("modal-title").textContent = "Failed to load."; }
  }

  function renderModal(p) {
    document.getElementById("modal-img").src = p.imageUrl;
    document.getElementById("modal-img").alt = p.title;
    document.getElementById("modal-title").textContent = p.title;
    document.getElementById("modal-caption").textContent = p.caption || "";

    const meta = [];
    if (p.uploaderName) meta.push(`<span>📷 <strong style="color:#374151;">${esc(p.uploaderName)}</strong></span>`);
    if (p.location)     meta.push(`<span>📍 ${esc(p.location)}</span>`);
    if (p.people?.length) meta.push(`<span>👥 ${p.people.map(esc).join(", ")}</span>`);
    if (p.createdAt)    meta.push(`<span>🗓 ${new Date(p.createdAt).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span>`);
    document.getElementById("modal-meta").innerHTML = meta.join("");

    if (p.aiTags?.length) {
      document.getElementById("modal-tags-inner").innerHTML =
        p.aiTags.map(t=>`<span style="background:#EFF6FF;color:#2563EB;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:50px;border:1px solid #BFDBFE;">${esc(t)}</span>`).join("");
      document.getElementById("modal-tags").style.display = "block";
    }

    document.getElementById("rating-summary").textContent = p.avgRating
      ? `${p.avgRating.toFixed(1)} / 5 · ${p.ratingCount} rating${p.ratingCount!==1?"s":""}`
      : "Be the first to rate!";
    if (p.ownRating) resetStars(p.ownRating);
    renderComments(p.comments || []);
  }

  function renderComments(comments) {
    const el = document.getElementById("comments-list");
    if (!comments.length) {
      el.innerHTML = "<p style='color:#94A3B8;font-size:13px;margin:0;font-style:italic;'>No comments yet. Be the first!</p>";
      return;
    }
    el.innerHTML = comments.map(c => `
      <div class="comment-bubble">
        <div class="comment-avatar">${esc((c.authorName||"?")[0]).toUpperCase()}</div>
        <div class="comment-body">
          <p style="margin:0 0 3px;font-size:12px;font-weight:800;color:#374151;">${esc(c.authorName||"User")}</p>
          <p style="margin:0;font-size:12.5px;color:#4B5563;line-height:1.4;">${esc(c.text)}</p>
        </div>
      </div>`).join("");
    el.scrollTop = el.scrollHeight;
  }

  function closeModal() {
    document.getElementById("modal-bg").classList.remove("open");
    document.body.style.overflow = "";
    openPhotoId = null;
  }
  function handleOverlayClick(e) { if (e.target.id==="modal-bg") closeModal(); }
  document.addEventListener("keydown", e => { if (e.key==="Escape") closeModal(); });

  async function submitComment(e) {
    e.preventDefault();
    const input = document.getElementById("comment-text");
    const errEl = document.getElementById("comment-error");
    const text  = input.value.trim();
    errEl.style.display = "none";
    if (!text || !openPhotoId) return;
    try {
      await addComment(openPhotoId, text);
      input.value = "";
      renderComments((await getPhoto(openPhotoId)).comments || []);
    } catch (err) { errEl.textContent = err.message; errEl.style.display = "block"; }
  }

  function setupStars() {
    document.querySelectorAll("#star-input .star").forEach(s => {
      s.addEventListener("mouseover", () => highlightStars(+s.dataset.v));
      s.addEventListener("mouseout",  () => resetStars(null));
      s.addEventListener("click",     () => submitRating(+s.dataset.v));
    });
  }
  function highlightStars(n) {
    document.querySelectorAll("#star-input .star").forEach(s => {
      s.style.color = +s.dataset.v <= n ? "#F59E0B" : "#E5E7EB";
    });
  }
  function resetStars(sel) {
    document.querySelectorAll("#star-input .star").forEach(s => {
      s.style.color = (sel!==null && +s.dataset.v<=sel) ? "#F59E0B" : "#E5E7EB";
    });
  }
  async function submitRating(value) {
    if (!openPhotoId) return;
    try {
      const r = await ratePhoto(openPhotoId, value);
      resetStars(value);
      document.getElementById("rating-summary").textContent =
        `${r.avgRating.toFixed(1)} / 5 · ${r.ratingCount} rating${r.ratingCount!==1?"s":""}`;
    } catch (err) {
      document.getElementById("comment-error").textContent = `Rating failed: ${err.message}`;
      document.getElementById("comment-error").style.display = "block";
    }
  }

  function esc(s) {
    return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
