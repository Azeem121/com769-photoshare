<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoShare</title>
  <link rel="stylesheet" href="/shared/styles.css" />
  <style>
    .role-tabs {
      display: flex;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .role-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: #f5f5f5;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      color: #555;
      transition: background 0.2s, color 0.2s;
    }
    .role-tab.active {
      background: #4f46e5;
      color: #fff;
    }
    .role-hint {
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 14px;
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing-card">
      <div class="landing-logo">PhotoShare</div>
      <p class="landing-tagline">Discover and share moments that matter.</p>

      <!-- Role selector -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" id="tab-consumer" onclick="selectRole('consumer')">
          Browse (Consumer)
        </button>
        <button type="button" class="role-tab" id="tab-creator" onclick="selectRole('creator')">
          Upload (Creator)
        </button>
      </div>
      <p class="role-hint" id="role-hint">Browse and rate photos uploaded by creators.</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="e.g. alice"
                 autocomplete="username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 4 characters"
                 autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%">
          Sign In / Register
        </button>

        <p class="error-text" id="login-error"></p>
      </form>

      <p class="login-note">
        New here? Just pick a username and password — your account is created automatically.
      </p>
    </div>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script>
    redirectIfLoggedIn();

    let selectedRole = "consumer";

    function selectRole(role) {
      selectedRole = role;
      document.getElementById("tab-consumer").classList.toggle("active", role === "consumer");
      document.getElementById("tab-creator").classList.toggle("active", role === "creator");
      document.getElementById("role-hint").textContent = role === "creator"
        ? "Upload and manage your own photos."
        : "Browse and rate photos uploaded by creators.";
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      const btn   = document.getElementById("login-btn");
      errEl.textContent = "";

      let username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        errEl.textContent = "Please enter a username and password.";
        return;
      }

      if (password.length < 4) {
        errEl.textContent = "Password must be at least 4 characters.";
        return;
      }

      // Append @creator suffix if creator role is selected (and not already present)
      if (selectedRole === "creator" && !username.endsWith("@creator")) {
        username = username + "@creator";
      }
      // Strip @creator suffix if consumer role is selected
      if (selectedRole === "consumer" && username.endsWith("@creator")) {
        username = username.replace(/@creator$/, "");
      }

      btn.disabled = true;
      btn.textContent = "Signing in…";

      try {
        const result = await login(username, password);
        saveSession(result.token, {
          userId:   result.userId,
          username: result.username,
          role:     result.role,
        });
        window.location.href = result.role === "creator" ? "/creator.html" : "/consumer.html";
      } catch (err) {
        errEl.textContent = err.message || "Login failed. Please try again.";
        btn.disabled = false;
        btn.textContent = "Sign In / Register";
      }
    }
  </script>
</body>
</html>
