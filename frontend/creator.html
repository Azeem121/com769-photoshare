<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoShare — Creator Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .spinner { display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;vertical-align:middle;margin-right:4px; }
    .spinner-blue { border-color:rgba(37,99,235,0.2);border-top-color:#2563eb; }
    @keyframes spin { to { transform:rotate(360deg) } }
    .card-img { transition: transform 0.3s ease; }
    .photo-card:hover .card-img { transform: scale(1.05); }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:#CBD5E1;border-radius:4px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- ── Navbar ──────────────────────────────────────────────────────────── -->
<nav class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
  <div class="flex items-center gap-4 px-6 h-14">
    <div class="flex items-center gap-2.5 flex-shrink-0">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      </div>
      <span class="font-black text-lg text-gray-900 tracking-tight">PhotoShare</span>
    </div>
    <div class="flex items-center gap-2 ml-auto">
      <div class="flex items-center gap-2 bg-gray-100 rounded-full px-3 py-1.5">
        <div id="user-avatar" class="w-6 h-6 rounded-full bg-amber-500 text-white text-xs font-bold flex items-center justify-center">?</div>
        <span id="nav-username" class="text-sm font-semibold text-gray-700 hidden sm:block">…</span>
        <span class="text-xs font-bold px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full">Creator</span>
      </div>
      <button onclick="logout()" class="text-sm font-semibold text-gray-500 hover:text-gray-800 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition">Sign out</button>
    </div>
  </div>
</nav>

<!-- ── Page content ────────────────────────────────────────────────────── -->
<div class="max-w-7xl mx-auto px-6 py-6 flex flex-col lg:flex-row gap-6 items-start">

  <!-- ── Upload panel ──────────────────────────────────────────────────── -->
  <div class="w-full lg:w-80 xl:w-96 flex-shrink-0 lg:sticky lg:top-20">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
      <div class="flex items-center gap-2 mb-5">
        <div class="w-8 h-8 bg-blue-50 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
        </div>
        <h2 class="font-bold text-gray-900">Upload Photo</h2>
      </div>

      <form id="upload-form" onsubmit="handleUpload(event)" class="space-y-4">

        <!-- Drop zone -->
        <div id="drop-zone" class="relative border-2 border-dashed border-gray-200 hover:border-blue-400 hover:bg-blue-50/30 rounded-xl p-6 text-center cursor-pointer transition-all">
          <input type="file" id="photo-file" accept="image/jpeg,image/png,image/gif,image/webp"
            onchange="handleFile(event)"
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
          <svg class="w-8 h-8 text-gray-300 mx-auto mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
          </svg>
          <p class="text-sm font-semibold text-gray-500">Click or drag to upload</p>
          <p class="text-xs text-gray-400 mt-1">JPEG, PNG, GIF, WebP · max 10 MB</p>
        </div>
        <img id="upload-preview" src="" alt="Preview" class="hidden w-full rounded-xl object-cover max-h-52 border border-gray-100" />

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Title <span class="text-red-400">*</span></label>
          <input type="text" id="photo-title" maxlength="100" required placeholder="Give your photo a title"
            class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300 transition" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Caption</label>
          <textarea id="photo-caption" maxlength="500" rows="3" placeholder="Tell the story behind this photo…"
            class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300 transition"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Location</label>
          <input type="text" id="photo-location" maxlength="100" placeholder="e.g. Belfast, UK"
            class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300 transition" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">People Tagged</label>
          <input type="text" id="photo-people" maxlength="200" placeholder="Alice, Bob, Carol"
            class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300 transition" />
        </div>

        <button type="submit" id="upload-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold text-sm py-3 rounded-xl transition-all flex items-center justify-center gap-2">
          Upload Photo
        </button>

        <p id="upload-error"   class="text-xs text-red-500   font-medium text-center hidden"></p>
        <p id="upload-success" class="text-xs text-green-600 font-medium text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- ── My Photos ─────────────────────────────────────────────────────── -->
  <div class="flex-1 min-w-0">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
      <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-amber-50 rounded-lg flex items-center justify-center">
            <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
          </div>
          <h2 class="font-bold text-gray-900">My Photos</h2>
        </div>
        <span id="photo-count" class="text-xs font-semibold text-gray-400 bg-gray-100 px-2.5 py-1 rounded-full"></span>
      </div>

      <div id="my-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <div class="col-span-full flex flex-col items-center py-16 gap-3 text-gray-400">
          <span class="spinner spinner-blue" style="width:24px;height:24px;border-width:2px;"></span>
          <p class="text-sm">Loading your photos…</p>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="/shared/auth.js"></script>
<script src="/shared/api.js"></script>
<script>
  (async () => {
    const user = requireAuth("creator");
    if (!user) return;
    setNavUser(user);
    document.getElementById("user-avatar").textContent = (user.username || "?")[0].toUpperCase();
    await refreshGrid();
  })();

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const preview = document.getElementById("upload-preview");
    preview.src = URL.createObjectURL(file);
    preview.classList.remove("hidden");
    const dz = document.getElementById("drop-zone");
    dz.style.borderColor = "#2563EB";
    dz.style.background  = "#EFF6FF";
  }

  async function handleUpload(e) {
    e.preventDefault();
    const errEl = document.getElementById("upload-error");
    const okEl  = document.getElementById("upload-success");
    const btn   = document.getElementById("upload-btn");
    errEl.classList.add("hidden");
    okEl.classList.add("hidden");

    const file = document.getElementById("photo-file").files[0];
    if (!file) { show(errEl, "Please select a photo."); return; }
    if (file.size > 10*1024*1024) { show(errEl, "File must be under 10 MB."); return; }

    const title = document.getElementById("photo-title").value.trim();
    if (!title) { show(errEl, "Title is required."); return; }

    const formData = new FormData();
    formData.append("photo",    file);
    formData.append("title",    title);
    formData.append("caption",  document.getElementById("photo-caption").value.trim());
    formData.append("location", document.getElementById("photo-location").value.trim());
    formData.append("people",   document.getElementById("photo-people").value.trim());

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Uploading…';

    try {
      const result = await uploadPhoto(formData);
      if (!result) { show(errEl, "No response from server."); return; }
      let msg = `"${result.title}" uploaded!`;
      if (result.aiTags?.length) msg += ` AI tags: ${result.aiTags.join(", ")}.`;
      show(okEl, msg);
      document.getElementById("upload-form").reset();
      document.getElementById("upload-preview").classList.add("hidden");
      document.getElementById("drop-zone").style.cssText = "";
      await refreshGrid();
    } catch (err) {
      show(errEl, err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = "Upload Photo";
    }
  }

  function show(el, msg) { el.textContent = msg; el.classList.remove("hidden"); }

  async function refreshGrid() {
    const grid = document.getElementById("my-grid");
    grid.innerHTML = '<div class="col-span-full flex flex-col items-center py-16 gap-3 text-gray-400"><span class="spinner spinner-blue" style="width:24px;height:24px;border-width:2px;border-color:rgba(37,99,235,.2);border-top-color:#2563eb;"></span><p class="text-sm">Loading…</p></div>';
    try {
      const data = await getMyPhotos();
      if (!data?.photos) { grid.innerHTML = '<div class="col-span-full text-center py-16 text-gray-400 text-sm">Could not load photos.</div>'; return; }
      const count = data.photos.length;
      document.getElementById("photo-count").textContent = count ? `${count} photo${count!==1?"s":""}` : "";
      grid.innerHTML = "";
      if (!count) {
        grid.innerHTML = `<div class="col-span-full flex flex-col items-center py-16 gap-3 text-gray-400">
          <svg class="w-12 h-12 text-gray-200" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
          <p class="font-semibold text-gray-400">No photos yet</p>
          <p class="text-xs text-gray-400">Upload your first photo using the form.</p>
        </div>`;
        return;
      }
      data.photos.forEach(p => grid.appendChild(makeCard(p)));
    } catch (err) {
      grid.innerHTML = `<div class="col-span-full text-center py-16 text-red-400 text-sm">Error: ${esc(err.message)}</div>`;
    }
  }

  function makeCard(p) {
    const div = document.createElement("div");
    div.className = "photo-card group relative bg-gray-50 rounded-xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition-all";
    div.dataset.id = p.id;
    const tags = (p.aiTags||[]).slice(0,2).map(t=>`<span class="text-xs bg-amber-50 text-amber-600 font-medium px-1.5 py-0.5 rounded-md">${esc(t)}</span>`).join("");
    div.innerHTML = `
      <div class="aspect-square bg-gray-100 overflow-hidden">
        <img src="${p.imageUrl}" alt="${esc(p.title)}" loading="lazy" class="card-img w-full h-full object-cover" />
      </div>
      <button onclick="handleDelete(event,'${p.id}')"
        class="absolute top-2 right-2 bg-white/90 hover:bg-red-50 border border-gray-200 hover:border-red-300 text-gray-500 hover:text-red-500 text-xs font-semibold px-2 py-1 rounded-lg opacity-0 group-hover:opacity-100 transition-all backdrop-blur-sm">
        Delete
      </button>
      <div class="p-3">
        <p class="text-xs font-semibold text-gray-800 truncate">${esc(p.title)}</p>
        ${p.location?`<p class="text-xs text-gray-400 truncate mt-0.5">📍 ${esc(p.location)}</p>`:""}
        <div class="flex items-center justify-between mt-1.5">
          <span class="text-xs text-gray-400">${p.avgRating?`<span class="text-amber-400">★</span> ${p.avgRating.toFixed(1)}`:`<span class="text-gray-300">★</span> —`}</span>
          <div class="flex gap-1">${tags}</div>
        </div>
      </div>`;
    return div;
  }

  async function handleDelete(e, id) {
    e.stopPropagation();
    if (!confirm("Delete this photo? This cannot be undone.")) return;
    try {
      await deletePhoto(id);
      document.querySelector(`[data-id="${id}"]`)?.remove();
      const remaining = document.querySelectorAll("#my-grid .photo-card").length;
      document.getElementById("photo-count").textContent = remaining ? `${remaining} photo${remaining!==1?"s":""}` : "";
      if (!remaining) {
        document.getElementById("my-grid").innerHTML = `<div class="col-span-full flex flex-col items-center py-16 gap-3 text-gray-400">
          <svg class="w-12 h-12 text-gray-200" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
          <p class="font-semibold text-gray-400">No photos yet</p>
          <p class="text-xs text-gray-400">Upload your first photo using the form.</p>
        </div>`;
      }
    } catch (err) { alert(`Delete failed: ${err.message}`); }
  }

  function esc(s) {
    return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
