# CI/CD Pipeline — PhotoShare (COM769)
#
# On every push to main:
#   1. Lint & unit-test the backend
#   2. Validate frontend files
#   3. Deploy backend to Azure Functions (Flex Consumption)
#   4. Deploy frontend to Azure Blob Storage static website
#
# Live backend:  https://photoshareapi-cpechycedwbecjae.francecentral-01.azurewebsites.net
# Live frontend: https://photosharestorage.z28.web.core.windows.net/

name: CI/CD — PhotoShare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  BACKEND_PATH: "backend"

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Lint & unit-test the backend
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_PATH }}/requirements.txt

      - name: Install dependencies
        run: |
          cd ${{ env.BACKEND_PATH }}
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          cd ${{ env.BACKEND_PATH }}
          flake8 . \
            --max-line-length=120 \
            --exclude=.venv,__pycache__,tests \
            --ignore=E501,W503 \
            --count

      - name: Run unit tests
        env:
          COSMOS_DB_CONNECTION_STRING: "AccountEndpoint=https://dummy.documents.azure.com;AccountKey=dHVmZg==;"
          COSMOS_DB_DATABASE_NAME: "photoshare"
          BLOB_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dHVmZg==;EndpointSuffix=core.windows.net"
          BLOB_CONTAINER_NAME: "photos"
          CV_ENDPOINT: ""
          CV_KEY: ""
        run: |
          cd ${{ env.BACKEND_PATH }}
          python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Validate frontend files
  # ─────────────────────────────────────────────────────────────────────────────
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required frontend files exist
        run: |
          echo "Checking frontend files..."
          test -f frontend/index.html     && echo "✓ index.html"
          test -f frontend/consumer.html  && echo "✓ consumer.html"
          test -f frontend/creator.html   && echo "✓ creator.html"
          test -f frontend/shared/auth.js && echo "✓ shared/auth.js"
          test -f frontend/shared/api.js  && echo "✓ shared/api.js"
          test -f frontend/shared/styles.css && echo "✓ shared/styles.css"
          test -f frontend/staticwebapp.config.json && echo "✓ staticwebapp.config.json"
          echo "All frontend files present."

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 — Deploy backend to Azure Functions (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies locally (for zip)
        run: |
          cd ${{ env.BACKEND_PATH }}
          pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Package backend as zip
        run: |
          cd ${{ env.BACKEND_PATH }}
          zip -r ../backend.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude "tests/*" \
            --exclude "local.settings.json"

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0800043853F24FD289ED94F4D54405A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0BB69726C684C95892A49DAE845BD7D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_77739247B20A4FE7BCF48E81AECD0DD7 }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name photoshareapi \
            --resource-group Azure_Functions \
            --src backend.zip \
            --build-remote true

      - name: Verify deployment (health check)
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://photoshareapi-cpechycedwbecjae.francecentral-01.azurewebsites.net/api/health)
          echo "Health check HTTP status: $STATUS"
          [ "$STATUS" = "200" ] && echo "Backend deployment verified!" || exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4 — Deploy frontend to Azure Blob Storage static website
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [test-backend, validate-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0800043853F24FD289ED94F4D54405A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0BB69726C684C95892A49DAE845BD7D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_77739247B20A4FE7BCF48E81AECD0DD7 }}

      - name: Deploy frontend to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name photosharestorage \
            --destination '$web' \
            --source frontend/ \
            --overwrite \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      - name: Verify frontend deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://photosharestorage.z28.web.core.windows.net/)
          echo "Frontend HTTP status: $STATUS"
          [ "$STATUS" = "200" ] && echo "Frontend deployment verified!" || exit 1
